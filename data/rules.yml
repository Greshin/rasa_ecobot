version: "3.1"

# Every message goes to the trip planner, which decides what happens next.
rules:
  - rule: greet
    steps:
      - intent: greet
      - action: action_trip_planner
  - rule: inform
    steps:
      - intent: inform
      - action: action_trip_planner
  - rule: affirm
    steps:
      - intent: affirm
      - action: action_trip_planner
  - rule: deny
    steps:
      - intent: deny
      - action: action_trip_planner
  - rule: thanks
    steps:
      - intent: thanks
      - action: action_trip_planner
  - rule: goodbye
    steps:
      - intent: goodbye
      - action: action_trip_planner
  - rule: human handoff
    steps:
      - intent: request_human
      - action: action_trip_planner
  - rule: start over
    steps:
      - intent: start_over
      - action: action_trip_planner
  - rule: weather question
    steps:
      - intent: ask_weather
      - action: action_trip_planner
  - rule: low confidence
    steps:
      - intent: nlu_fallback
      - action: action_trip_planner
