version: "3.1"

# Example conversations. In this bot, every message goes to action_trip_planner,
# which reads the trip so far and decides what to ask next. These stories show
# Rasa typical paths through a conversation.

stories:
  - story: plan a trip step by step
    steps:
      - intent: greet
      - action: action_trip_planner
      - intent: inform
      - action: action_trip_planner
      - intent: inform
      - action: action_trip_planner
      - intent: inform
      - action: action_trip_planner
      - intent: affirm
      - action: action_trip_planner

  - story: say no to a hotel
    steps:
      - intent: greet
      - action: action_trip_planner
      - intent: inform
      - action: action_trip_planner
      - intent: deny
      - action: action_trip_planner

  - story: ask for a human advisor
    steps:
      - intent: greet
      - action: action_trip_planner
      - intent: request_human
      - action: action_trip_planner

  - story: start over and say thanks
    steps:
      - intent: greet
      - action: action_trip_planner
      - intent: start_over
      - action: action_trip_planner
      - intent: thanks
      - action: action_trip_planner
      - intent: goodbye
      - action: action_trip_planner

  - story: ask about the weather
    steps:
      - intent: greet
      - action: action_trip_planner
      - intent: inform
      - action: action_trip_planner
      - intent: ask_weather
      - action: action_trip_planner
